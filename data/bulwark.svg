<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Bulwark</title>
  <!-- Bulwark icon: a stone tower with a waving flag that carries a gamepad. Original artwork for this project. -->
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa09a"/>
      <stop offset="0.55" stop-color="#7d837e"/>
      <stop offset="1" stop-color="#5a605c"/>
    </linearGradient>
    <linearGradient id="flag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ec8467"/>
      <stop offset="1" stop-color="#c95a3e"/>
    </linearGradient>
  </defs>

  <!-- flagpole with finial: tall enough that the whole flag flies above the bricks -->
  <rect x="62.5" y="4" width="3" height="34" fill="#3a3d3b"/>
  <circle cx="64" cy="3.3" r="2.8" fill="#d9b25c" stroke="#3a3d3b" stroke-width="1"/>

  <!-- waving swallowtail flag, about 3:2 like a real flag -->
  <path d="M65.5 5 C73 2.5 80 8 87 5.5 C91 4.2 94 4.5 97 5.5 L91.5 15.5 L97.5 25.5 C94 24.6 91 24.5 87 25.8 C80 28.3 73 22.8 65.5 25.3 Z"
        fill="url(#flag)" stroke="#7a3322" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M65.5 15.3 C73 12.8 80 18.3 87 15.8" fill="none" stroke="#b44e35" stroke-width="1" opacity="0.5"/>
  <!-- gamepad on the flag: the app drawing's outline scaled down, with a clear margin to the flag's edges -->
  <path d="M 77.80 10.20 C 75.65 10.20 73.61 10.25 72.54 10.47 C 71.79 10.63 71.41 11.22 71.30 12.08 C 71.09 13.26 70.82 14.66 70.66 16.27 C 70.50 17.77 70.60 19.17 71.25 19.76 C 71.89 20.30 73.07 20.24 73.50 19.71 C 73.83 19.17 74.15 18.20 74.69 17.50 C 75.76 17.45 76.73 17.45 77.80 17.45 C 78.87 17.45 79.84 17.45 80.91 17.50 C 81.45 18.20 81.77 19.17 82.10 19.71 C 82.53 20.24 83.71 20.30 84.35 19.76 C 85.00 19.17 85.10 17.77 84.94 16.27 C 84.78 14.66 84.51 13.26 84.30 12.08 C 84.19 11.22 83.81 10.63 83.06 10.47 C 81.99 10.25 79.95 10.20 77.80 10.20 Z"
        fill="#fdf3e7" stroke="#7a3322" stroke-width="0.7" stroke-linejoin="round"/>
  <g fill="#c95a3e">
    <circle cx="73.77" cy="12.75" r="1.05"/>
    <circle cx="79.79" cy="15.33" r="1.05"/>
    <rect x="75.27" y="14.2" width="0.76" height="2.26"/>
    <rect x="74.52" y="14.95" width="2.26" height="0.76"/>
    <circle cx="81.75" cy="11.98" r="0.42"/>
    <circle cx="80.92" cy="12.83" r="0.42"/>
    <circle cx="82.58" cy="12.83" r="0.42"/>
    <circle cx="81.75" cy="13.68" r="0.42"/>
  </g>

  <!-- battlements: two corner merlons and a smaller centre one that holds the pole -->
  <g fill="url(#stone)" stroke="#2b2e2c" stroke-width="2" stroke-linejoin="round">
    <path d="M22 30 H44 V46 H22 Z"/>
    <path d="M84 30 H106 V46 H84 Z"/>
    <path d="M55 36 H73 V46 H55 Z"/>
    <!-- parapet band, a little wider than the tower -->
    <path d="M20 45 H108 V56 H20 Z"/>
    <!-- tower body, slightly tapering upward -->
    <path d="M27 56 H101 L103 106 H25 Z"/>
    <!-- flared base -->
    <path d="M25 106 H103 L110 116 C90 120 38 120 18 116 Z"/>
  </g>

  <!-- brick courses and joints -->
  <g stroke="#3d413e" stroke-width="1.6" stroke-linecap="square" fill="none" opacity="0.75">
    <path d="M26.6 69 H101.4 M26 82 H102 M25.5 94 H102.5"/>
    <path d="M45 56 V69 M64 56 V69 M83 56 V69"/>
    <path d="M36 69 V82 M55 69 V82 M73 69 V82 M92 69 V82"/>
    <path d="M45 82 V94 M64 82 V94 M83 82 V94"/>
    <path d="M36 94 V106 M55 94 V106 M73 94 V106 M92 94 V106"/>
    <path d="M33 30 V45 M95 30 V45 M64 45 V56 M40 45 V56 M88 45 V56"/>
  </g>
  <!-- shaded right face of the tower -->
  <path d="M90 56 H101 L103 106 H92 Z" fill="#2b2e2c" opacity="0.18"/>
  <!-- arrow slit -->
  <path d="M61.5 74 H66.5 V88 C66.5 90 61.5 90 61.5 88 Z" fill="#1f2221" stroke="#1f2221" stroke-width="1"/>
  <!-- lit top edges -->
  <g stroke="#c7ccc6" stroke-width="1.2" opacity="0.7">
    <path d="M23.5 31.5 H42.5 M85.5 31.5 H104.5 M56.5 37.5 H71.5 M21.5 46.5 H106.5"/>
  </g>
</svg>
